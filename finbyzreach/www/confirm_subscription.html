{% extends "templates/web.html" %}
{% block title %}Confirm subscription{% endblock %}
{% block page_content %}
<main style="max-width:560px;margin:48px auto;padding:32px;background:#fff">
  <h1>Confirm your email subscription</h1>
  {% if valid_link %}
  <p>Confirm that you want to receive this type of email.</p>
  <button id="confirm-subscription" class="btn btn-primary" type="button">Confirm subscription</button>
  <p id="confirmation-result" role="status" aria-live="polite"></p>
  <script>
    document.getElementById('confirm-subscription').addEventListener('click', async function () {
      this.disabled = true;
      try {
        const response = await fetch('/api/method/finbyzreach.subscription_preferences.confirm_subscription', {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'X-Frappe-CSRF-Token': frappe.csrf_token || ''},
          body: JSON.stringify({preference: {{ preference | tojson }}, token: {{ token | tojson }}})
        });
        if (!response.ok) throw new Error('Invalid or expired link');
        document.getElementById('confirmation-result').textContent = 'Your subscription has been confirmed.';
      } catch (error) {
        document.getElementById('confirmation-result').textContent = 'This confirmation link is invalid or has expired.';
        this.disabled = false;
      }
    });
  </script>
  {% else %}<p>This confirmation link is invalid.</p>{% endif %}
</main>
{% endblock %}
